root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/babel"
entrypoint = ["./tmp/main"]
include_ext = ["go", "html"]
exclude_dir = ["dist", "backups", "tmp", ".git"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true
